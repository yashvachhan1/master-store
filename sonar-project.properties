sonar.projectKey=yashvachhan1_master-store
sonar.organization=yashvachhan1

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Master Store E-commerce
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=apps,packages

# Exclude these files/directories from analysis
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,**/dist/**,**/.next/**,**/.turbo/**

# TypeScript Analysis
sonar.typescript.tsconfigPath=tsconfig.json
